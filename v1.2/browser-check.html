px;\n  border: 1px solid var(--line-strong); border-radius: 6px;\n  background: #fff; font-size: 13px; font-weight: 500; line-height: 20px;\n  white-space: normal; overflow-wrap: anywhere; cursor: pointer;\n}\nbutton:hover, .file-label:hover { background: var(--subtle); border-color: #aeb5bf; }\nbutton.primary { color: #fff; background: var(--ink); border-color: var(--ink); }\nbutton.primary:hover { background: #3a3c42; }\nbutton:disabled { color: #9298a2; background: #f6f7f9; border-color: var(--line); cursor: not-allowed; }\ninput, select, textarea {\n  min-width: 0; max-width: 100%; border: 1px solid var(--line-strong);\n  border-radius: 6px; background: #fff; padding: 7px 9px; line-height: 20px;\n}\ninput[type=number], select { min-height: 36px; }\ninput[type=checkbox], input[type=radio] {\n  width: 16px; height: 16px; padding: 0; margin: 0; flex: none; accent-color: var(--accent);\n}\ninput:focus-visible, select:focus-visible, textarea:focus-visible,\nbutton:focus-visible, a:focus-visible, summary:focus-visible {\n  outline: 2px solid var(--accent); outline-offset: 3px;\n}\ninput[aria-invalid=true] { border-color: var(--danger); background: var(--danger-soft); }\ntextarea { display: block; width: 100%; margin: 8px 0 12px; resize: vertical; font-size: 13px; }\nh1, h2, h3, h4 { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }\nh1 { margin: 0; font-size: 24px; line-height: 32px; }\nh2 { margin: 0 0 16px; font-size: 18px; line-height: 26px; }\nh3, h4 { margin: 0 0 8px; font-size: 15px; line-height: 22px; }\np { margin: 0 0 12px; overflow-wrap: anywhere; }\nstrong { font-weight: 600; }\n.status, .muted { color: var(--muted); font-size: 12px; line-height: 19px; }\n.error { padding: 10px 12px; border-left: 2px solid var(--danger); color: var(--danger); background: var(--danger-soft); overflow-wrap: anywhere; }\n\n/* Compact navigation stays in document flow, including the expanded tools. */\n.app-header { padding: 14px 24px; border-bottom: 1px solid var width: 0; }\n#page-description { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 21px; }\n#page-title:focus { outline: none; }\n.research { padding-top: 5px; color: var(--muted); font-size: 11px; line-height: 18px; }\n.app-page { min-width: 0; padding: 0; border: 0; }\n.section-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 14px; }\n.section-head h2, .section-head h3 { margin: 0; }\n.section-head > span { color: var(--muted); font-size: 12px; }\n.commands { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }\n.commands > * { min-width: 0; max-width: 100%; }\n.toolbar { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px 8px; margin: 0 0 12px; padding: 0 0 16px; border-bottom: 1px solid var(--line); }\n.toolbar label { display: grid; gap: 5px; min-width: 0; color: var(--muted); font-size: 12px; }\n.toolbar label:first-child { flex: 1 1 230px; }\n.toolbar select { width: 100%; color: var(--ink); font-size: 13px; }\n#experiment-status { margin-bottom: 20px; }\n#operation { margin: 0; }\nfooter { margin-top: 28px; padding: 16px 0 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 18px; }\nfooter { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }\n.profile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }\n.profile-grid > div { min-width: 0; }\n.personal-advanced { grid-column: 1 / -1; }\n.sleep-helper { margin: 20px 0; }\n.diary-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 20px; }\n.diary-nav [aria-current=\"step\"] { color: #fff; background: var(--ink); border-color: var(--ink); }\n.diary-fields { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 520px; margin: 16px 0; }\n.diary-fields label { display: grid; gap: 6px; min-width: 0; font-size: 13px; }\n.diary-fields input, .diary-fields select, .diary-fields /div>\u003c/header>\n\u003cmain>\n\u003cdiv class=\"heading\">\u003cdiv>\u003ch1 id=\"page-title\" tabindex=\"-1\">这周，你想改善什么？\u003c/h1>\u003cp id=\"page-description\" hidden>\u003c/p>\u003c/div>\u003cspan class=\"research\" title=\"当前模型未经真实个体数据验证，计算结果用于情景比较，不是个人预测。\">研究原型\u003c/span>\u003c/div>\n\u003cdiv id=\"experiment-controls\" class=\"toolbar\" hidden>\u003clabel>当前问题 \u003cselect id=\"question\">\u003coption value=\"week\">工作、学习与恢复怎么分配\u003c/option>\u003coption value=\"spend\">多花这笔钱，能维持多久\u003c/option>\u003coption value=\"invest\">这笔投资会占用多少备用钱\u003c/option>\u003c/select>\u003c/label>\u003clabel>周期 \u003cselect id=\"weeks\">\u003coption value=\"4\">4 周\u003c/option>\u003coption value=\"12\" selected>12 周\u003c/option>\u003coption value=\"26\">26 周\u003c/option>\u003coption value=\"52\">52 周\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"pin\">把当前安排存作对照\u003c/button>\u003cbutton id=\"restore\">恢复保存的对照安排\u003c/button>\u003cbutton id=\"reset\">恢复默认输入\u003c/button>\u003c/div>\n\u003cdiv id=\"experiment-status\" hidden>\u003cp id=\"operation\" class=\"status\" role=\"status\">基准：初始默认值\u003c/p>\u003cp id=\"error\" role=\"alert\" class=\"error\" hidden>\u003c/p>\u003c/div>\n\u003csection id=\"guide\" class=\"app-page decision-guide\" aria-label=\"做一个选择\">\n\u003cdiv class=\"guide-progress-head\">\u003cp id=\"guide-progress\" class=\"status\" role=\"status\">第 1 步，共 5 步\u003c/p>\u003cbutton id=\"guide-load\">读取上次试行计划\u003c/button>\u003c/div>\n\u003cnav class=\"guide-step-nav\" aria-label=\"决策步骤\">\u003col>\n\u003cli>\u003cbutton id=\"guide-nav-1\" type=\"button\" aria-current=\"step\" aria-controls=\"guide-step-1\" aria-label=\"第1步：选择目标\" title=\"选择目标\">\u003cspan class=\"step-number\">1\u003c/span>\u003cspan class=\"step-label\">选择目标\u003c/span>\u003c/button>\u003c/li>\n\u003cli>\u003cbutton id=\"guide-nav-2\" type=\"button\" disabled aria-controls=\"guide-step-2\" aria-label=\"第2步：现状与底线\" title=\"现状与底线\">\u003cspan class=\"step-number\">2\u003c/span>\u003cspan class=\"step-label\">现状与底线\u003c/span>\u003c/button>\u003c/li>\n\u003cli>\u003cbutton id=\"guide-nav-3\" type=\"button\" disabled aria-controls=\"guide-step-3\" aria-label=\"第3步：比较代价\" title=\"比较代价\">\u003cspan class=\"step-number\">3\u003c/span>\u003cspan class=\"step-label\">比较代价\u003c/span>\u003c/button>\u003c/li>\n\u003cli>\u003cbutton id=\"guide-nav-4\" type=\"button\" disabled aria-controls=\"guide-step-4\" aria-label=\"第4步：选择方案\" title=\"选择方案\">\u003cspan class=\"step-number\">4\u003c/span>\u003cspan class=\"step-label\">选择方案\u003c/span>\u003c/button>\u003c/li>\n\u003cli>\u003cbutton id=\"guide-nav-5\" type=\"button\" disabled aria-controls=\"guide-step-5\" aria-label=\"第5步：试一周再回看\" title=\"试一周再回看\">\u003cspan class=\"step-number\">5\u003c/span>\u003cspan class=\"step-label\">试一周再回看\u003c/span>\u003c/button>\u003c/li>\n\u003c/ol>\u003c/nav>\u003cp id=\"guide-context\" class=\"muted\" hidden>\u003c/p>\n\u003cdiv id=\"guide-step-1\" class=\"guide-stage guide-step\" role=\"region\" aria-labelledby=\"guide-goal-title\">\u003ch2 id=\"guide-goal-title\" tabindex=\"-1\">我想解决什么问题？\u003c/h2>\n\u003cfieldset class=\"guide-goal-picker\" aria-labelledby=\"guide-goal-title\">\u003clabel>\u003cinput id=\"guide-goal-learn\" name=\"guide-goal\" type=\"radio\" value=\"learn\" checked>\u003cspan>多学一点\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"guide-goal-recover\" name=\"guide-goal\" type=\"radio\" value=\"recover\">\u003cspan>少累一点\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"guide-goal-income\" name=\"guide-goal\" type=\"radio\" value=\"income\">\u003cspan>增加收入\u003c/span>\u003c/label>\u003c/fieldset>\n\u003cdiv id=\"guide-income-setting\" class=\"guide-income-setting\" hidden>\u003clabel for=\"guide-income-mode\">额外工作如何计酬？\u003c/label>\u003cselect id=\"guide-income-mode\">\u003coption value=\"unknown\">还不确定\u003c/option>\u003coption value=\"output\">工作产出增加，报酬也增加\u003c/option>\u003coption value=\"fixed\">固定工资，无额外报酬\u003c/option>\u003c/select>\u003cp id=\"guide-income-assumption\" class=\"muted\">\u003c/p>\u003c/div>\n\u003cdiv class=\"guide-amount-control\">\u003cdiv class=\"guide-amount-heading\">\u003clabel id=\"guide-action\" for=\"guide-amount\">给学习腾时间\u003c/label>\u003cspan>每周 \u003coutput id=\"guide-amount-value\" for=\"guide-amount\">2\u003c/output> 小时\u003c/span>\u003c/div>\u003cinput id=\"guide-amount\" type=\"range\" min=\"0\" max=\"48\" step=\"1\" value=\"2\" aria-describedby=\"guide-target\">\u003cdiv class=\"guide-amount-scale\" aria-hidden=\"true\">\u003cspan>0\u003c/span>\u003cspan>12\u003c/span>\u003cspan>24\u003c/span>\u003cspan>36\u003c/span>\u003cspan>48 小时\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"muted\" id=\"guide-target\">\u003c/p>\u003c/div>\n\u003cdiv id=\"guide-step-2\" class=\"guide-stage guide-step\" role=\"region\" aria-labelledby=\"guide-boundaries-title\" hidden>\u003cdiv class=\"section-head\">\u003ch2 id=\"guide-boundaries-title\" tabindex=\"-1\">我的现状与底线\u003c/h2>\u003clabel for=\"guide-weeks\">比较周期 \u003cselect id=\"guide-weeks\">\u003coption value=\"4\">4 周\u003c/option>\u003coption value=\"12\" selected>12 周\u003c/option>\u003coption value=\"26\">26 周\u003c/option>\u003coption value=\"52\">52 周\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"personal-inputs\" class=\"profile-grid\">\u003c/div>\u003cdetails id=\"sleep-helper\" class=\"sleep-helper\">\u003csummary>睡眠和精力不知道怎么填？\u003c/summary>\n\u003cdiv class=\"section-head\">\u003ch3 id=\"diary-progress\">先有一个参考\u003c/h3>\u003cspan id=\"diary-count\">已记录0天\u003c/span>\u003c/div>\n\u003cnav class=\"diary-nav\" aria-label=\"睡眠记录步骤\">\u003cbutton id=\"diary-nav-1\" type=\"button\">1 定参考\u003c/button>\u003cbutton id=\"diary-nav-2\" type=\"button\">2 记实际\u003c/button>\u003cbutton id=\"diary-nav-3\" type=\"button\">3 看变化\u003c/button>\u003c/nav>\n\u003cdiv id=\"diary-stage-1\">\u003ch3>通常睡多久，第二天比较有精神？\u003c/h3>\u003cp id=\"diary-reference\">\u003c/p>\u003cdiv id=\"diary-reference-field\">\u003c/div>\u003cp>以前少睡了多少、恢复得快不快，先不急着猜。记下实际情况后再看。\u003c/p>\u003cbutton id=\"diary-start\" type=\"button\" class=\"primary\">先记一天\u003c/button>\u003c/div>\n\u003cdiv id=\"diary-stage-2\" hidden>\u003ch3>这一天，实际怎么样？\u003c/h3>\u003cdiv class=\"diary-fields\">\n\u003clabel for=\"diary-date\">记录哪一天\u003cinput id=\"diary-date\" type=\"date\">\u003c/label>\n\u003clabel for=\"diary-hours\">一共睡了多久（小时）\u003cinput id=\"diary-hours\" type=\"number\" min=\"0\" max=\"24\" step=\"0.25\" placeholder=\"例如 7.5\">\u003cspan>前一晚加当天午睡；不算醒着躺床的时间。\u003c/span>\u003c/label>\n\u003clabel for=\"diary-fatigue\">当天睡前有多累（0–10）\u003cinput id=\"diary-fatigue\" type=\"number\" min=\"0\" max=\"10\" step=\"0.5\" placeholder=\"例如 4\">\u003cspan>0 完全不累 · 5 明显累 · 10 极累\u003c/span>\u003c/label>\n\u003clabel for=\"diary-quality\">睡得怎样\u003cselect id=\"diary-quality\">\u003coption value=\"\">请选择\u003c/option>\u003coption value=\"1\">很差\u003c/option>\u003coption value=\"2\">不太好\u003c/option>\u003coption value=\"3\">一般\u003c/option>\u003coption value=\"4\">比较好\u003c/option>\u003coption value=\"5\">很好\u003c/option>\u003c/select>\u003c/label>\n\u003clabel for=\"diary-context\">这一天的情况\u003cselect id=\"diary-context\">\u003coption value=\"ordinary\">普通一天\u003c/option>\u003coption value=\"free\">睡到自然醒，没有赶时间\u003c/option>\u003coption value=\"special\">生病、饮酒、通宵等特殊情况\u003c/option>\u003c/select>\u003c/label>\n\u003clabel for=\"diary-note\">想补充的话（选填）\u003ctextarea id=\"diary-note\" maxlength=\"200\" rows=\"2\">\u003c/textarea>\u003c/label>\u003c/div>\n\u003cdiv class=\"commands\">\u003cbutton id=\"diary-save\" type=\"button\" class=\"primary\">保存这一天\u003c/button>\u003cbutton id=\"diary-to-summary\" type=\"button\">看看记录说明了什么\u003c/button>\u003c/div>\n\u003cdetails>\u003csummary>之前的记录\u003c/summary>\u003cdiv id=\"diary-history\" class=\"table-wrap\">\u003c/div>\u003cbutton id=\"diary-undo\" type=\"button\" hidden>撤销刚才的删除\u003c/button>\u003c/details>\u003c/div>\n\u003cdiv id=\"diary-stage-3\" hidden>\n\u003cdiv class=\"diary-result\">\u003ch3>睡多久比较合适\u003c/h3>\u003cp id=\"diary-need-status\">\u003c/p>\u003cbutton id=\"diary-adopt-need\" type=\"button\" disabled>暂时保留当前参考\u003c/button>\u003c/div>\n\u003cdiv class=\"diary-result\">\u003ch3>最近一周的实际状态\u003c/h3>\u003cp id=\"diary-actual-status\">\u003c/p>\u003cp id=\"diary-debt-status\">\u003c/p>\n\u003clabel class=\"diary-assumption\">\u003cinput id=\"diary-zero\" type=\"checkbox\">估算时，每段完整记录之前的缺觉暂按0小时计算\u003c/label>\n\u003cbutton id=\"diary-adopt-actual\" type=\"button\" disabled>用最近一周更新我的起点\u003c/button>\u003c/div>\n\u003cdiv class=\"diary-result\">\u003ch3>恢复得快不快\u003c/h3>\u003cp id=\"diary-fit-status\">\u003c/p>\u003cbutton id=\"diary-adopt-recovery\" type=\"button\" disabled>采用更贴近记录的设置\u003c/button>\u003cdetails>\u003csummary>依据与具体数值\u003c/summary>\u003cp id=\"diary-fit-detail\">\u003c/p>\u003c/details>\u003c/div>\n\u003cdetails>\u003csummary>核对一周实际花的时间\u003c/summary>\u003clabel for=\"diary-week-select\">哪一周\u003cselect id=\"diary-week-select\">\u003c/select>\u003c/label>\u003cdiv id=\"diary-week-fields\" class=\"diary-fields\">\u003c/div>\u003cbutton id=\"diary-confirm-week\" type=\"button\" disabled>确认这一周的实际安排\u003c/button>\u003c/details>\n\u003cp id=\"diary-adopted\" class=\"status\">\u003c/p>\u003cbutton id=\"diary-back-record\" type=\"button\">继续记录\u003c/button>\u003c/div>\u003cp id=\"diary-message\" class=\"status\" role=\"status\">\u003c/p>\n\u003c/details>\u003cp id=\"personal-error\" class=\"error\" role=\"alert\" hidden>\u003c/p>\u003cp id=\"guide-start\" class=\"status\">\u003c/p>\u003cdetails>\u003csummary>其他输入\u003c/summary>\u003cp id=\"guide-assumptions\">\u003c/p>\u003cdiv class=\"commands\">\u003ca href=\"#decision\">全部时间与资金\u003c/a>\u003ca href=\"#systems\">身体、情绪与其他状态\u003c/a>\u003ca href=\"#model\">模型参数\u003c/a>\u003c/div>\u003c/details>\u003ch3 class=\"boundary-heading\">不能减少的时间\u003c/h3>\u003cdiv class=\"guide-boundaries\">\u003clabel class=\"guide-check\">\u003cinput id=\"guide-protect-sleep\" type=\"checkbox\" checked>睡眠\u003c/label>\u003clabel class=\"guide-check\">\u003cinput id=\"guide-protect-work\" type=\"checkbox\">工作\u003c/label>\u003clabel class=\"guide-check\">\u003cinput id=\"guide-protect-learn\" type=\"checkbox\">学习\u003c/label>\u003c/div>\u003cdetails id=\"guide-limits-panel\">\u003csummary>我能接受的底线（选填）\u003c/summary>\u003cdiv class=\"guide-limit-fields\">\u003clabel for=\"guide-limit-minCash\">现金至少保留（元）\u003cinput id=\"guide-limit-minCash\" type=\"number\" min=\"0\" max=\"1000000000\" step=\"any\" placeholder=\"不设置\">\u003c/label>\u003clabel for=\"guide-limit-minSleep\">每周至少睡眠（小时）\u003cinput id=\"guide-limit-minSleep\" type=\"number\" min=\"0\" max=\"168\" step=\"any\" placeholder=\"不设置\">\u003c/label>\u003clabel for=\"guide-limit-maxIncomeLoss\">最多少赚（元 / \u003cspan id=\"guide-limit-period\">12周\u003c/span>）\u003cinput id=\"guide-limit-maxIncomeLoss\" type=\"number\" min=\"0\" max=\"1000000000\" step=\"any\" placeholder=\"不设置\">\u003c/label>\u003c/div>\u003cp id=\"guide-limit-error\" class=\"error\" role=\"alert\" hidden>\u003c/p>\u003c/details>\u003c/div>\n\u003cdiv id=\"guide-step-3\" class=\"guide-stage guide-step\" role=\"region\" aria-labelledby=\"guide-compare-title\" hidden>\n\u003cdiv class=\"section-head\">\u003ch2 id=\"guide-compare-title\" tabindex=\"-1\">把收益与代价放在一起看\u003c/h2>\u003cspan id=\"guide-period\">相对原安排 · 观察12周\u003c/span>\u003c/div>\u003cp id=\"guide-status\" role=\"status\">\u003c/p>\n\u003cdiv id=\"guide-compare-panel\" hidden>\u003cdiv class=\"guide-compare-pickers\">\u003clabel for=\"guide-compare-a\">方案A\u003cselect id=\"guide-compare-a\">\u003c/select>\u003c/label>\u003clabel id=\"guide-compare-b-label\" for=\"guide-compare-b\">方案B\u003cselect id=\"guide-compare-b\">\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv id=\"guide-comparisons\">\u003c/div>\u003cp id=\"guide-direct-summary\" class=\"guide-direct-summary\">\u003c/p>\n\u003cdiv class=\"section-head guide-margin-heading\">\u003ch3>离我的底线还有多远\u003c/h3>\u003cbutton id=\"guide-edit-limits\" type=\"button\">修改底线\u003c/button>\u003c/div>\u003cdiv id=\"guide-margins\">\u003c/div>\n\u003cdetails id=\"guide-trend-details\">\u003csummary>沿途变化与最吃紧的一周\u003c/summary>\u003cfieldset class=\"guide-chart-picker\" aria-label=\"沿途变化指标\">\u003clabel>\u003cinput id=\"guide-trend-cash\" type=\"radio\" name=\"guide-trend\" value=\"cash\">\u003cspan>现金\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"guide-trend-fatigue\" type=\"radio\" name=\"guide-trend\" value=\"fatigue\">\u003cspan>疲劳\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"guide-trend-sleepDebt\" type=\"radio\" name=\"guide-trend\" value=\"sleepDebt\">\u003cspan>估计欠的睡眠\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"guide-trend-effectiveLearn\" type=\"radio\" name=\"guide-trend\" value=\"effectiveLearn\" checked>\u003cspan>学习效果（折算）\u003c/span>\u003c/label>\u003c/fieldset>\u003cp id=\"guide-trend-unit\" class=\"muted\">\u003c/p>\u003cdiv class=\"guide-chart-legend\" id=\"guide-trend-legend\">\u003c/div>\u003cdiv id=\"guide-trend-chart\">\u003c/div>\u003cdiv id=\"guide-process-summary\">\u003c/div>\u003cdetails>\u003csummary>逐周数值\u003c/summary>\u003cdiv id=\"guide-trend-values\" class=\"table-wrap\">\u003c/div>\u003c/details>\u003c/details>\n\u003cdetails id=\"guide-detail-details\">\u003csummary>投入与完整数值\u003c/summary>\u003cdiv id=\"guide-full-values\" class=\"table-wrap\">\u003c/div>\u003c/details>\u003c/div>\n\u003cdetails>\u003csummary>哪些安排被排除了？\u003c/summary>\u003cdiv id=\"guide-excluded\">\u003c/div>\u003c/details>\u003c/div>\n\u003cdiv id=\"guide-step-4\" class=\"guide-stage guide-step\" role=\"region\" aria-labelledby=\"guide-choice-title\" hidden>\u003ch2 id=\"guide-choice-title\" tabindex=\"-1\">哪一种代价，你愿意接受？\u003c/h2>\u003cfieldset class=\"guide-choices\">\u003clegend class=\"sr-only\">选择一项试行安排\u003c/legend>\u003cdiv id=\"guide-options\" class=\"guide-choice-list\">\u003c/div>\u003c/fieldset>\u003cp id=\"guide-choice-summary\" class=\"status\" role=\"status\">尚未选择方案。\u003c/p>\u003c/div>\n\u003cdiv id=\"guide-step-5\" class=\"guide-stage guide-step\" role=\"region\" aria-labelledby=\"guide-review-title\" hidden>\u003ch2 id=\"guide-review-title\" tabindex=\"-1\">试行一周，再复盘\u003c/h2>\u003cp id=\"guide-trial-placeholder\">尚未选择可试行的方案。\u003c/p>\u003cdiv id=\"guide-trial\" hidden>\u003cdiv id=\"guide-trial-plan\">\u003c/div>\u003clabel id=\"guide-note-label\" for=\"guide-note\">这一周，准备学什么？实际执行后，哪里与预期不同？\u003c/label>\u003ctextarea id=\"guide-note\" rows=\"3\" maxlength=\"2000\" placeholder=\"例如：完成一个课程单元；记录实际学习时数、工作是否受影响、疲劳有没有变化。\">\u003c/textarea>\u003cdiv class=\"commands\">\u003cbutton id=\"guide-save\" class=\"primary\">保存这次试行计划\u003c/button>\u003cbutton id=\"guide-cancel\">暂不改变\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cp id=\"guide-step-hint\" class=\"status\" role=\"status\" hidden>\u003c/p>\u003cdiv class=\"guide-step-actions\">\u003cbutton id=\"guide-back\" type=\"button\" hidden>上一步\u003c/button>\u003cbutton id=\"guide-next\" type=\"button\" class=\"primary\">下一步：现状与底线\u003c/button>\u003c/div>\u003cp id=\"guide-message\" class=\"status\" role=\"status\">\u003c/p>\n\u003c/section>\n\u003csection id=\"decision\" class=\"app-page\" aria-label=\"方案对照\" hidden>\u003cdiv class=\"summary\" id=\"summary\">\u003c/div>\u003cdiv id=\"verdict\" class=\"verdict\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"section-head\">\u003ch2>本周与后续安排\u003c/h2>\u003cdiv class=\"commands\">\u003cbutton data-preset=\"recover\">少加班 8 小时\u003c/button>\u003cbutton data-preset=\"spend\">生活享受花费增加 300 元\u003c/button>\u003cbutton data-preset=\"invest\">每周买入增加 1,000 元\u003c/button>\u003c/div>\u003c/div>\u003cdiv id=\"plan-controls\" class=\"form-columns\">\u003c/div>\n\u003cdetails>\u003csummary>逐周安排\u003c/summary>\u003clabel for=\"schedule\">周计划 JSON · 小时/周、元/周\u003c/label>\u003ctextarea id=\"schedule\" rows=\"4\" spellcheck=\"false\" placeholder='{\"2\":{\"work\":32,\"leisure\":20},\"3\":{\"buy\":0}}'>{}\u003c/textarea>\u003cbutton id=\"schedule-apply\">应用逐周安排\u003c/button>\u003cp id=\"schedule-note\" class=\"muted\">无逐周覆盖\u003c/p>\u003c/details>\n\u003cdiv class=\"section-head\">\u003ch3>沿途变化\u003c/h3>\u003clabel>指标 \u003cselect id=\"chart-metric\">\u003coption value=\"fatigue\">累的程度 · 分\u003c/option>\u003coption value=\"cash\">现金余额 · 元\u003c/option>\u003coption value=\"wealth\">净财富 · 元\u003c/option>\u003coption value=\"knowledge\">知识积累 · 分\u003c/option>\u003coption value=\"net\">这一周的综合得分 · 分\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"legend\">\u003cspan class=\"current\">当前安排\u003c/span>\u003cspan class=\"baseline\">保存的对照安排\u003c/span>\u003c/div>\u003cdiv id=\"trajectory\" class=\"chart\">\u003c/div>\u003cdiv id=\"weekly-results\" class=\"table-wrap\">\u003c/div>\n\u003c/section>\n\u003csection id=\"demo\" class=\"app-page\" aria-labelledby=\"demo-title\" hidden>\n\u003cdiv class=\"sleep-demo\">\u003cdiv class=\"section-head\">\u003ch2>每周多睡12小时：新旧模型对照\u003c/h2>\u003cspan>固定示例 · 52周\u003c/span>\u003c/div>\n\u003cfieldset class=\"guide-goal-picker\" aria-label=\"睡眠起点\">\u003clabel>\u003cinput id=\"sleep-case-original\" type=\"radio\" name=\"sleep-case\" checked>\u003cspan>原例：每天参考8小时\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"sleep-case-higherNeed\" type=\"radio\" name=\"sleep-case\">\u003cspan>每天参考改为9小时\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"sleep-case-existingDebt\" type=\"radio\" name=\"sleep-case\">\u003cspan>估计还欠14小时睡眠\u003c/span>\u003c/label>\u003c/fieldset>\n\u003clabel for=\"sleep-demo-source\">时间来源\u003cselect id=\"sleep-demo-source\">\u003coption value=\"unallocated\">空余时间\u003c/option>\u003coption value=\"leisure\">自由休息\u003c/option>\u003c/select>\u003c/label>\u003cp id=\"sleep-demo-context\" class=\"muted\">\u003c/p>\u003cdiv id=\"sleep-demo-results\">\u003c/div>\n\u003ch3>沿途减轻了多少疲劳\u003c/h3>\u003cp class=\"muted\">相对各自原安排的差值 · 分 · 负值表示减轻\u003c/p>\u003cdiv class=\"guide-chart-legend\">\u003cspan class=\"trend-original\">旧模型1.0\u003c/span>\u003cspan class=\"trend-a\">现模型（1.1起）\u003c/span>\u003c/div>\u003cdiv id=\"sleep-demo-chart\">\u003c/div>\n\u003cdetails>\u003csummary>现金与学习效果（折算）\u003c/summary>\u003cdiv id=\"sleep-demo-other\">\u003c/div>\u003c/details>\u003cdetails>\u003csummary>逐周数值\u003c/summary>\u003cdiv id=\"sleep-demo-weekly\" class=\"table-wrap\">\u003c/div>\u003c/details>\u003c/div>\n\u003cdiv class=\"section-head\">\u003ch2 id=\"demo-title\">选择示例目标\u003c/h2>\u003cspan>独立示例 · 12 周\u003c/span>\u003c/div>\n\u003cfieldset class=\"guide-goal-picker\" aria-labelledby=\"demo-title\">\u003clabel>\u003cinput id=\"demo-goal-learn\" name=\"demo-goal\" type=\"radio\" value=\"learn\" checked>\u003cspan>多学一点\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"demo-goal-recover\" name=\"demo-goal\" type=\"radio\" value=\"recover\">\u003cspan>少累一点\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"demo-goal-income\" name=\"demo-goal\" type=\"radio\" value=\"income\">\u003cspan>增加收入\u003c/span>\u003c/label>\u003c/fieldset>\n\u003cdiv class=\"demo-context\">\u003cp id=\"demo-start\" class=\"demo-start\">每周：工作 40 · 学习 6 · 睡眠 56 · 休闲 14 · 其他 52 小时\u003c/p>\u003cp id=\"demo-pay\">计酬：80 元/有效小时\u003c/p>\u003c/div>\n\u003cfieldset class=\"demo-options\">\u003clegend id=\"demo-action\">每周多学\u003c/legend>\u003clabel>\u003cinput id=\"demo-1\" name=\"demo-amount\" type=\"radio\" value=\"1\" checked>\u003cspan>1 小时\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"demo-2\" name=\"demo-amount\" type=\"radio\" value=\"2\">\u003cspan>2 小时\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"demo-4\" name=\"demo-amount\" type=\"radio\" value=\"4\">\u003cspan>4 小时\u003c/span>\u003c/label>\u003clabel>\u003cinput id=\"demo-all\" name=\"demo-amount\" type=\"radio\" value=\"all\">\u003cspan>全部时数\u003c/span>\u003c/label>\u003c/fieldset>\n\u003cp id=\"demo-baseline\" class=\"demo-baseline\">\u003c/p>\n\u003cp id=\"demo-status\" class=\"status\" role=\"status\">\u003c/p>\u003cdiv id=\"demo-results\">\u003c/div>\n\u003c/section>\n\u003csection id=\"marginal\" class=\"app-page\" aria-labelledby=\"marginal-title\" hidden>\n\u003cdiv class=\"section-head\">\u003ch2 id=\"marginal-title\">调整时间\u003c/h2>\u003cspan>相对当前安排\u003c/span>\u003c/div>\n\u003cdiv class=\"marginal-controls\">\n\u003clabel for=\"marginal-target\">增加哪一项\u003cselect id=\"marginal-target\">\u003c/select>\u003c/label>\n\u003clabel for=\"marginal-source\">时间从哪里来\u003cselect id=\"marginal-source\">\u003c/select>\u003c/label>\n\u003clabel for=\"marginal-step\">每次增加（小时）\u003cinput id=\"marginal-step\" type=\"number\" min=\"0.01\" max=\"168\" step=\"any\" value=\"1\">\u003c/label>\n\u003clabel for=\"marginal-frequency\">持续方式\u003cselect id=\"marginal-frequency\">\u003coption value=\"weekly\">每周重复\u003c/option>\u003coption value=\"once\">只调整一周\u003c/option>\u003c/select>\u003c/label>\n\u003clabel for=\"marginal-week\">调整第几周\u003cinput id=\"marginal-week\" type=\"number\" min=\"1\" max=\"12\" step=\"1\" value=\"1\" disabled>\u003c/label>\n\u003c/div>\n\u003cp id=\"marginal-status\" class=\"status\" role=\"status\">\u003c/p>\n\u003cdiv id=\"marginal-summary\" class=\"summary marginal-summary\" aria-live=\"polite\">\u003c/div>\n\u003cp id=\"marginal-verdict\">\u003c/p>\n\u003cdetails>\u003csummary>第一周和最后的结果\u003c/summary>\u003cdiv id=\"marginal-detail\" class=\"table-wrap\">\u003c/div>\u003c/details>\n\u003cdiv class=\"section-head marginal-subhead\">\u003ch3>继续增加，下一段还值多少？\u003c/h3>\u003clabel for=\"marginal-metric\">观察指标 \u003cselect id=\"marginal-metric\">\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv id=\"marginal-curve\" class=\"marginal-curve\">\u003c/div>\n\u003cdetails>\u003csummary>其他变化与综合得分\u003c/summary>\u003cdiv id=\"marginal-systems\" class=\"table-wrap\">\u003c/div>\u003cdiv id=\"marginal-contributions\" class=\"table-wrap\">\u003c/div>\u003c/details>\n\u003c/section>\n\u003csection id=\"systems\" class=\"app-page\" aria-label=\"我的当前状态\" hidden>\u003cdiv class=\"section-head\">\u003ch2>当前起点\u003c/h2>\u003c/div>\u003cdiv id=\"state-controls\" class=\"system-grid\">\u003c/div>\u003c/section>\n\u003csection id=\"evidence\" class=\"app-page\" aria-label=\"检验假设\" hidden>\u003cdiv class=\"section-head\">\u003ch2>换些情况，结果会怎样\u003c/h2>\u003cbutton id=\"analyze\" class=\"primary\">计算\u003c/button>\u003c/div>\u003cdiv id=\"uncertainty\" class=\"analysis-output\">尚未计算\u003c/div>\u003cdiv id=\"sensitivity\" class=\"table-wrap\">\u003c/div>\n\u003cdetails>\u003csummary>用已有数据调整模型（进阶）\u003c/summary>\u003cp>至少 6 条记录 · 疲劳恢复率 / 学习增益\u003c/p>\u003cdiv class=\"commands\">\u003cbutton id=\"template\">导出观测模板\u003c/button>\u003clabel class=\"file-label\">导入观测 JSON\u003cinput id=\"observations\" type=\"file\" accept=\".json,application/json\">\u003c/label>\u003c/div>\u003cdiv id=\"calibration-result\">\u003c/div>\u003cbutton id=\"adopt-fit\" hidden>采用这组设置\u003c/button>\u003c/details>\u003c/section>\n\u003csection id=\"model\" class=\"app-page\" aria-label=\"底层模型\" hidden>\n\u003cdiv class=\"section-head\">\u003ch2>模型参数与方程\u003c/h2>\u003cdiv class=\"commands\">\u003ca href=\"#guide\">回到我的选择\u003c/a>\u003ca href=\"MODEL_SPEC.txt\" target=\"_blank\">完整函数说明 ↗\u003c/a>\u003c/div>\u003c/div>\n\u003cdetails id=\"model-language\">\u003csummary>页面上的话，对应模型中的什么？\u003c/summary>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>页面用语\u003c/th>\u003cth>模型含义\u003c/th>\u003cth>怎么读\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>最后剩多少钱\u003c/td>\u003ctd>期末现金\u003c/td>\u003ctd>可用现金，不含持仓，也没有扣除全部债务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最后一周有多累\u003c/td>\u003ctd>期末疲劳指数\u003c/td>\u003ctd>0–100分，越低表示模型中的累积疲劳越少\u003c/td>\u003c/tr>\u003ctr>\u003ctd>这段时间平均有多累\u003c/td>\u003ctd>全程周末疲劳平均值\u003c/td>\u003ctd>看过程，不能代替每天的真实感受\u003c/td>\u003c/tr>\u003ctr>\u003ctd>学习效果（折算小时）\u003c/td>\u003ctd>累计有效学习时数\u003c/td>\u003ctd>实际投入按注意力等因素折算，不是额外空出来的时间\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最后学到多少\u003c/td>\u003ctd>期末知识指数\u003c/td>\u003ctd>相对当前任务的熟悉程度，不是考试成绩\u003c/td>\u003c/tr>\u003ctr>\u003ctd>扣掉欠款后的资产\u003c/td>\u003ctd>净财富\u003c/td>\u003ctd>现金 + 风险资产 − 债务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>按个人偏好的综合得分\u003c/td>\u003ctd>贴现累计净效用 J\u003c/td>\u003ctd>取决于个人权重，不作人与人排名\u003c/td>\u003c/tr>\u003ctr>\u003ctd>多花一小时，值不值？\u003c/td>\u003ctd>边际效应与有限差分\u003c/td>\u003ctd>比较这次时间交换的额外结果，不是精确导数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>这些估计稳不稳？\u003c/td>\u003ctd>随机情景与敏感性\u003c/td>\u003ctd>改变假设后的结果范围，不是现实发生概率保证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>睡多久的参考 / 估计欠的睡眠 / 恢复设置\u003c/td>\u003ctd>sleepNeed / sleepDebt / fatigueRecovery\u003c/td>\u003ctd>参考、模型记账与待检验系数，不是测出的生理常数\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>表述参考：\u003ca href=\"https://www.nngroup.com/articles/4-principles-reduce-cognitive-load/\" target=\"_blank\" rel=\"noreferrer\">NN/g 表单认知负担研究\u003c/a>。相关输入放在一起，先呈现当前任务，完整定义留在这里。\u003c/p>\u003c/details>\n\u003cdiv class=\"model-overview\">\u003cdiv>\u003ch3>评价\u003c/h3>\u003cp class=\"equation\">Net = 加权效用 − 情绪成本 − 疲劳成本 − 欲望成本 − 风险成本\u003cbr>J = Σ beta^(t−1) × Net_t\u003c/p>\u003cp class=\"muted\">J 评价整个周期，不直接创造现金、健康或知识。\u003c/p>\u003c/div>\u003cdiv>\u003ch3>状态转移与约束\u003c/h3>\u003cp class=\"equation\">X_(t+1) = F(X_t, A_t, 外部冲击)\u003cbr>每周时间 ≤ 168 小时；现金 ≥ 0\u003cbr>卖出 ≤ 期初持仓；买入与卖出不同时为正\u003c/p>\u003cp class=\"muted\">违反资源约束即停止路径，不用虚构收益填补缺口。\u003c/p>\u003c/div>\u003c/div>\n\u003cdetails open>\u003csummary>机制参数\u003c/summary>\u003cdiv id=\"parameters\" class=\"form-columns\">\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>个人偏好权重\u003c/summary>\u003cdiv id=\"weights\" class=\"weight-grid\">\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>六系统观察函数\u003c/summary>\u003cdiv id=\"system-equations\">\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>变量关系与本周核算\u003c/summary>\u003cdiv class=\"flow\" aria-label=\"因果层次\">\u003cdiv>实际资源\u003cbr>\u003csmall>小时 · 现金 · 资产 · 负债\u003c/small>\u003c/div>\u003cspan>→\u003c/span>\u003cdiv>状态与有效行动\u003cbr>\u003csmall>恢复 · 注意力 · 调节 · 支持\u003c/small>\u003c/div>\u003cspan>→\u003c/span>\u003cdiv>下一周结果\u003cbr>\u003csmall>现金流 · 疲劳 · 知识 · 关系\u003c/small>\u003c/div>\u003cspan>→\u003c/span>\u003cdiv>个人评价\u003cbr>\u003csmall>偏好权重 · 不适 · 累计效用\u003c/small>\u003c/div>\u003c/div>\u003cp class=\"muted\">评价权重不直接改变身体或现金；方案改变才影响后续状态。当前只比较指定方案，不自动生成“最优人生”。\u003c/p>\u003cdiv id=\"trace\">\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>边际效应的计算口径\u003c/summary>\u003cdiv id=\"marginal-formula\" class=\"equation\">\u003c/div>\u003cp class=\"muted\">同一起点、参数、偏好和外部冲击；沿用当前逐周安排。增加项与来源一起改变，因此结果属于这次时间交换，不能全部归给增加项。来自未分配时间时，模型中的自主时间也会减少。\u003c/p>\u003cp class=\"muted\">这是有限差分，不是精确导数、现实因果效应或最优工时建议。采用无随机噪声路径，不等于随机结果的期望；阈值和截断可能产生拐点。收入按有效工时计酬，不代表固定工资。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>完整变量字典\u003c/summary>\u003cdiv id=\"dictionary\" class=\"table-wrap\">\u003c/div>\u003c/details>\n\u003cdetails id=\"model-diary\">\u003csummary>实际记录如何修正睡眠设置\u003c/summary>\u003cp>记录入口在“做一个选择 → 现状与底线 → 睡眠和精力不知道怎么填？”。每天记录前一晚加当天午睡的实际睡眠、当天睡前累的程度、睡眠感受和特殊情况。它是本工具的简化记录表，不是标准睡眠日记量表。\u003c/p>\u003cp>近期28天有至少14天记录，其中至少5天是自由睡醒、疲劳不超过3/10、睡眠感受至少“一般”、睡眠4–12小时，才显示这些天睡眠时长的中位数（四舍五入到0.25小时）。它只提供比较方案的参考，不能由此确认个人生理需求。14天、5天和筛选范围是本版工程规则，没有临床标定。\u003c/p>\u003cp>完整周按周一至周日汇总，还需要前一周日的疲劳作为起点。每日疲劳0–10乘10映射到模型刻度；睡眠感受1–5映射到0、25、50、75、100并取周平均。这是待检验的计算映射，不是医学量表换算。漏记不补0，不连接跨缺口的周。\u003c/p>\u003cp>缺觉从每段完整记录的0小时起算，使用当前参考时长、睡眠质量和1.1睡眠账本。必须主动勾选接受这个起点假设，才可采用账本或试算恢复率；此前缺觉仍未知。采用最近一周还要求该周结束不超过7天，并核对该周实际工作、学习、通勤家务照护、运动、陪伴和自由休息时间，总时间不能超过168小时。\u003c/p>\u003cp>恢复试算至少需要6个已核对、无特殊情况、期初疲劳至少10/100的周，最多使用最近12个，最近一个不早于28天前。前2/3周用于拟合，后1/3周用于核对。只试算fatigueRecovery（0.05–0.80，间隔0.01），不同时反推睡眠需求和所有身体参数。其他状态使用核对该周时保存的模型设置，不把它们当作实测值。\u003c/p>\u003cp>只有后段均方误差减少至少1分²且超过10%、最优点不在边界、近优参数范围不超过0.20，才提供采用按钮；否则保留原值。近优按训练误差不超过最优误差加max(1,最优误差×10%)筛选。它只能说明在当前假设下更贴近这些记录，不证明恢复率已被识别或具有因果意义。\u003c/p>\u003cp>保存记录不会自动修改模型；点击采用后才更新对应设置并自动重算个人方案。每日和每周草稿、记录及核对内容保存在本机，包含在“导出全部数据”中。修改已确认周的记录会使确认失效；固定示例与保存的对照安排不受影响。此前单独设置的逐周安排仍保留。\u003c/p>\u003cp>参考：\u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3250369/\" target=\"_blank\" rel=\"noreferrer\">Consensus Sleep Diary 原论文\u003c/a>提供了低阅读负担、明确时间边界和日常记录的设计启发；\u003ca href=\"https://support.ouraring.com/hc/en-us/articles/46233324892691-Sleep-Debt\" target=\"_blank\" rel=\"noreferrer\">Oura 的睡眠债说明\u003c/a>区分数据不足与已有估计。本工具没有使用它们的算法或验证结论。详细设计见\u003ca href=\"SLEEP_DIARY.txt\" target=\"_blank\">记录与修正规则\u003c/a>和\u003ca href=\"LANGUAGE_RESEARCH.txt\" target=\"_blank\">整站表述依据\u003c/a>。\u003c/p>\u003c/details>\n\u003cdetails id=\"model-results\">\u003csummary>结果指标、基准与逐周安排\u003c/summary>\u003cp>现金、资产、债务和净财富以人民币计量，不限制为0–100；净财富 = 现金 + 风险资产 − 债务。疲劳分越低表示模型中的累积疲劳越少。知识分是相对当前任务的知识参照，不是考试成绩；疲劳分不是医学量表，六系统分数不衡量人的价值。\u003c/p>\u003cp>J是个人偏好权重下的贴现累计净效用。偏好、起点或机制参数不同，不能把净效用差全部归因于方案优劣；即使口径相同，也不由总分自动决定取舍。\u003c/p>\u003cp>专业方案对照使用显式固定的基准。五步主线和边际效应使用当前已应用的原安排作为对照，不使用固定基准。示例与专业实验相互独立，使用内置起点；三类示例都相对各自不调整的原安排计算。\u003c/p>\u003cp>变化百分比 =（调整后 − 原安排）÷ 原安排 × 100%，使用未舍入数值计算。疲劳减少显示负号，但标为减负；原值为0或接近0时不计算比例。时间交换分别以原安排中对应活动的累计小时为分母；底线余量不混用这个百分比。疲劳、知识等分数的百分比只是模型指数的相对变化，不等于人的感受改善了同样百分比。\u003c/p>\u003cp>全程平均疲劳 = 第1至最后一周的周末疲劳分之和 ÷ 周数；累计疲劳负担为这个和乘以每周1周，单位分·周。两者不额外计入共同的期初点，也不是日内疲劳积分；累计减少20分·周不能说成期末减少20分。同一周期内，平均与累计负担的变化比例相同，不是两份独立收益。\u003c/p>\u003cp>逐周安排以周数为键，只覆盖该周填写的字段；未指定的周沿用基础安排。时间单位是小时/周，金额单位是元/周。修改输入后，随机情景分析需重新计算。\u003c/p>\u003c/details>\n\u003cdetails id=\"model-sleep\">\u003csummary>睡眠与疲劳：个人需求、睡眠债与恢复\u003c/summary>\u003cp>本版将个人需求 N（小时/周）、实际睡眠 H、期初睡眠债 D、睡眠质量 Q（0–100分）和基础恢复率 r 分开。个人需求按每天填写，再乘7；默认8小时不是所有人的统一标准。疲劳仍是模型指数。\u003c/p>\u003cp class=\"equation\">N = 7 × 每日需求；短缺 = max(0, N − H)；超需 = max(0, H − N)\u003cbr>q = 0.5 + 0.5 × Q/100；可偿还债额 A = D + 短缺\u003cbr>偿还预算 B = 补眠偿还效率 × q × 超需\u003cbr>偿还量 R = A × (1 − exp(−B/A))；A=0时取0\u003cbr>D_next = A − R\u003c/p>\u003cp>睡眠债是模型中的累计未满足时长，不是已测出的生理欠账。当前假设：睡到个人需求可以停止新增债，但旧债需要超需睡眠逐步偿还；无债时不能预存负债。偿还量不超过现有债或预算，账本可逐周复核。周汇总无法区分每天少睡与周末补眠。\u003c/p>\u003cp class=\"equation\">充足度 a = (1 − exp(−H/N)) / (1 − exp(−1))\u003cbr>有效恢复率 = 1 − (1 − r × q)^a\u003cbr>债疲劳增量 = 睡眠债疲劳强度 × [1 − exp(−(D + D_next)/(2N))]\u003cbr>疲劳_next = clip(原疲劳 × (1 − 有效恢复率) + 0.5 × 过载 + 债疲劳增量 + 情绪健康损耗 − 0.12 × min(运动, 5))\u003c/p>\u003cp>恢复随睡眠时长平滑增加、边际递减，不在56或63小时截断。原本已睡够且无睡眠债时，额外睡眠收益仍有限。短缺还进入当周情绪负荷；旧版直接加0.6×短缺的疲劳项已经移除。睡眠质量在一次预测中保持输入值，不再由多睡小时自动提高。\u003c/p>\u003cp>基础恢复率、补眠偿还效率与债疲劳强度含义不同，分别控制原有疲劳消退、睡眠债偿还和债对疲劳的作用。参数范围是计算边界，不是医学建议。当前校准只拟合基础恢复率与学习增益；个人需求和睡眠债系数仍需真实记录检验。\u003c/p>\u003cp>“看完整示例”内置56→68小时、持续52周的新旧对照，并可切换需求9小时或已有14小时债的假设。两版各自比较原安排与调整后安排，不把不同起点混成收益。旧1.0完整保留；此处的新公式没有实证标定。\u003c/p>\u003cp>依据：\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/12683469/\" target=\"_blank\" rel=\"noreferrer\">慢性睡眠限制与累积表现损失（2003）\u003c/a>、\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/20815182/\" target=\"_blank\" rel=\"noreferrer\">恢复睡眠剂量与表现恢复（2010）\u003c/a>、\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/15164894/\" target=\"_blank\" rel=\"noreferrer\">睡眠不足易感性的个体差异（2004）\u003c/a>。研究支持区分持续不足、恢复和个体差异；并未给出本工具的指数公式或分数系数。\u003c/p>\u003c/details>\n\u003cdetails id=\"model-demos\">\u003csummary>三类示例：起点、路径与计算假设\u003c/summary>\u003cdiv id=\"demo-model-definitions\" class=\"table-wrap\">\u003c/div>\u003cp>三类示例均持续12周，每周调整1、2或4小时，总转入量为12、24或48小时。每张卡片比较原安排与调整后的期末结果；工作收入为周期累计值。展开数据区同时展示第1周差值、12周期末值和完整周期每转入1小时的平均变化。相邻段0→1、1→2、2→4用各自新增总时数作分母，重新计算结果，不把平均收益线性倍增。\u003c/p>\u003cp>收入按有效工作小时乘以时薪计酬，全部工作沿用同一规则，支出保持不变；不适用于没有加班报酬的固定工资，也未另外建模税费或新增通勤成本。知识、注意力和疲劳会改变有效工时，因此名义工时增加不保证收入按比例增加。其他状态、参数与偏好采用本版默认值；没有外部冲击，使用无随机噪声路径。\u003c/p>\u003cp>在当前学习示例中，工作与学习在过载函数中同权，且没有触发不同的情绪超额，因而工作换学习可能不改变疲劳分；这不表示现实中学习没有消耗。睡眠减少可能通过疲劳影响后续工作和学习效率。休闲减少同时改变恢复与情绪调节空间，这些影响由后续状态方程计算。\u003c/p>\u003cp>高疲劳体验成本在60分以上才计入总分，不能用总分替代疲劳指标。示例展示预设交换，并不筛选“最佳”方案；资源不可行时保留失败原因。工作职责、照护义务和个体睡眠需要尚未全部作为硬约束，示例不是个人预测。\u003c/p>\u003c/details>\n\u003cdetails id=\"model-analysis\">\u003csummary>随机情景、敏感性与用已有数据调整模型（进阶）\u003c/summary>\u003cp>随机分析使用80条同种子情景。区间来自模型的正态收益假设，不是现实置信区间；均值与分位数只纳入完整可行路径，失败比例单列。配对比较只使用两组都可行且起点、机制、偏好一致的路径。\u003c/p>\u003cp>单参数局部敏感性保持其余输入不变，通常上下调整20%；接近零时使用参数范围的2%。这是局部假设扰动，不是统计置信区间。\u003c/p>\u003cp>用已有数据调整模型（进阶）至少需要6条按时间排列的真实记录，每条包含当周期初状态、实际行动和下一周期初观测。仅拟合疲劳恢复率与学习增益两个系数，末段留出检验；留出误差未降低时不提供采用操作。它不识别全部因果关系、不拟合个人价值权重，也不构成临床或金融预测验证。\u003c/p>\u003cp>效用贡献是评价公式的会计分解：正贡献提高J，负贡献降低J，成本减少记作正贡献；不是独立因果贡献。舍入可能产生尾差。\u003c/p>\u003c/details>\n\u003cdetails id=\"model-storage\">\u003csummary>数据联动、本机保存与文件范围\u003c/summary>\u003cp>五步主线、全部输入、我的当前状态与底层参数共用一份个人数据。修改后自动更新候选方案和结果；固定基准保持不变，固定示例也不随个人参数变化。选择方案只是建立试行计划，不会自动把原安排改成所选安排。逐周 JSON 需要点击应用，随机分析需要重新计算。\u003c/p>\u003cp>本机自动保存输入、参数、偏好、固定基准、周期、逐周安排、当前步骤、各目标和时数下的选择与复盘草稿，以及示例浏览选择。无效输入作为草稿保留，并暂停相关结果展示。刷新会恢复；浏览器禁止存储时，页面提示导出保存。不同浏览器、文件路径或设备可能使用不同的存储空间。\u003c/p>\u003cp>导出全部数据包含上述工作区及当前可计算的结果；导入会校验后整体替换当前工作区，结果重新计算。支持旧版0.3/1.0/1.1实验文件和1.0/1.1完整工作区。新旧版本使用独立存储键；在旧版本导出全部数据，再到1.2导入。旧数据缺少的睡眠债默认为0、每日需求8小时、偿还效率0.8、债疲劳强度6，均须核对；导入后按新公式重新计算，不覆盖旧版本原存档。“保存这次试行计划”另存一份可读取的最近试行快照，每次覆盖上一份；工作区导出包含当前选择与全部复盘草稿，但不另外打包此前独立保存的历史快照。读取试行快照会恢复它的输入、参数与安排。复盘文字不自动校准参数。睡眠日记录、按日期和周保存的草稿、周核对与起点假设也随工作区保存和导出；采用记录需明确点击，旧文件没有记录时保持为空。数据不上传服务器。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>用途与边界\u003c/summary>\u003cdiv class=\"purpose-grid\">\u003cdiv>\u003ch3>把取舍摆出来\u003c/h3>\u003cp>同一份时间不能同时用来加班、学习和睡眠。比较安排的现金、精力与成长代价，找到值得小范围尝试的改变。\u003c/p>\u003c/div>\u003cdiv>\u003ch3>检验自己的假设\u003c/h3>\u003cp>把判断拆成可讨论的条件，再用真实记录检验。\u003c/p>\u003c/div>\u003cdiv>\u003ch3>保留不能回答的部分\u003c/h3>\u003cp>它不能预测命运、诊断健康或保证投资收益；总分也不能替代价值判断。工作下限、照护责任与个体睡眠需求尚未作为硬约束。\u003c/p>\u003c/div>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>新旧模型的口径变化\u003c/summary>\u003cdiv id=\"version-notes\">\u003c/div>\u003ca href=\"CHANGELOG.txt\" target=\"_blank\">版本变化记录 ↗\u003c/a>\u003c/details>\u003c/section>\n\u003csection id=\"files\" class=\"files app-page\" aria-label=\"实验文件\" hidden>\u003ch2>我的数据\u003c/h2>\u003cdiv class=\"commands\">\u003cbutton id=\"save\">保存到本机\u003c/button>\u003cbutton id=\"load\">读取本机数据\u003c/button>\u003c/div>\u003ch2>跨设备文件\u003c/h2>\u003cdiv class=\"commands\">\u003cbutton id=\"export\" class=\"primary\">导出全部数据\u003c/button>\u003clabel class=\"file-label\">导入并替换数据\u003cinput id=\"import\" type=\"file\" accept=\".json,application/json\">\u003c/label>\u003c/div>\u003ch2>试行计划\u003c/h2>\u003ca href=\"#guide\">打开本周试行计划\u003c/a>\u003c/section>\n\u003cfooter>\u003cspan>Financial Human Model · 1.2 · 本地运行\u003c/span>\u003cspan id=\"workspace-status\" role=\"status\">\u003c/span>\u003c/footer>\n\u003c/main>\u003cscript>// Generated from v1.2/src; do not edit this file directly.\n(()=>{\n'use strict';\nconst __modules=Object.create(null);\n__modules[\"schema\"]=(()=>{\nconst VERSION = '1.2.0';\nconst f = (key, label, unit, min, max, value, meaning) => ({key,label,unit,min,max,value,meaning});\nconst STATE_GROUPS = [\n  {id:'body',name:'身体与恢复',fields:[\n    f('health','基础健康','分',0,100,80,'主观功能状态，不是疾病诊断；100 为本人健康参照'),\n    f('sleepQuality','睡眠质量','分',0,100,75,'最近一周自评睡眠恢复质量'),\n    f('fatigue','累积疲劳','分',0,100,30,'跨周保留；越高表示越疲惫'),\n    f('sleepDebt','期初睡眠债','小时',0,10000,0,'尚未补足的累计睡眠时长差额；0为默认假设，不是实测结论；与金融债务分开')\n  ]},\n  {id:'cognition',name:'认知与判断',fields:[\n    f('knowledge','任务相关知识','分',0,100,60,'相对当前任务所需知识，不是智商'),\n    f('calibration','判断校准','分',0,100,60,'预测与结果吻合程度；无记录时为自评'),\n    f('metacognition','复盘与自知','分',0,100,65,'识别错误和修正假设的能力'),\n    f('bias','判断偏差','分',0,100,30,'冲动、确认偏误等的汇总代理；越高越不利')\n  ]},\n  {id:'emotion',name:'情绪与动机',fields:[\n    f('regulation','调节能力','分',0,100,65,'识别情绪、暂停反应和求助能力'),\n    f('rumination','反刍程度','分',0,100,30,'重复思考造成的注意力占用'),\n    f('stress','累积压力','分',0,100,30,'跨周保留的情绪负荷'),\n    f('motivation','内在动机','分',0,100,65,'行动与个人意愿一致时的持续动力')\n  ]},\n  {id:'social',name:'关系与支持',fields:[\n    f('support','可用支持','分',0,100,65,'需要时可实际获得的帮助'),\n    f('trust','关系信任','分',0,100,65,'可靠、互惠和边界的综合评价'),\n    f('network','机会触达','分',0,100,50,'相关领域的连接质量'),\n    f('conflict','关系冲突','分',0,100,25,'未解决冲突与关系消耗')\n  ]},\n  {id:'finance',name:'资金与负债',fields:[\n    f('cash','现金余额','元',0,100000000,30000,'不含风险资产；不得通过截断掩盖负余额'),\n    f('assets','风险资产市值','元',0,100000000,20000,'单一汇总风险资产；买入是资产转换而非收益'),\n    f('debt','债务本金','元',0,100000000,10000,'计息负债；本金偿还不是净财富损失')\n  ]},\n  {id:'desire',name:'欲望与自主',fields:[\n    f('clarity','价值清晰度','分',0,100,65,'能否辨别自己真正想要什么'),\n    f('agency','选择自主感','分',0,100,65,'相同时间安排也可能是自愿或被迫'),\n    f('comparison','比较与身份压力','分',0,100,40,'外部比较的驱动力；也进入情绪负荷'),\n    f('targetSpend','期望品质支出','元/周',0,1000000,500,'在必要支出之外，希望维持的品质消费水平')\n  ]}\n];\nconst PLAN_GROUPS = [\n  {id:'time',name:'每周时间',fields:[\n    f('sleep','睡眠','小时/周',0,168,56,'睡眠实际时长'),f('work','工作','小时/周',0,168,40,'投入时长；收入受有效工作效率影响'),\n    f('learn','学习','小时/周',0,168,6,'投入时长；产出受身体、动机和偏差影响'),f('exercise','运动','小时/周',0,168,3,'适度活动投入；收益饱和'),\n    f('relation','关系投入','小时/周',0,168,6,'陪伴、沟通与合作'),f('leisure','自主休闲','小时/周',0,168,12,'自愿安排的休闲时间'),\n    f('care','照护与必要事务','小时/周',0,168,21,'家务、通勤及照护，不直接算作自主时间')\n  ]},\n  {id:'money',name:'每周资金安排',fields:[\n    f('wage','标准时薪','元/有效小时',0,100000,80,'研究示例按有效小时计酬；固定薪资需另建收入规则'),\n    f('essential','必要支出','元/周',1,1000000,800,'基础生活、住房等必要开支'),f('discretionary','品质消费','元/周',0,1000000,300,'不含学习支出和情绪性额外支出'),\n    f('learningSpend','学习支出','元/周',0,1000000,100,'课程或训练支出，仅记账；不保证学习增益'),\n    f('buy','买入风险资产','元/周',0,10000000,500,'以现金购买；与卖出不可同时为正'),f('sell','卖出风险资产','元/周',0,10000000,0,'仅可卖出当前持有的市值'),\n    f('repay','偿还本金','元/周',0,10000000,100,'最多偿还剩余本金，末周自动减少'),\n    f('valueFit','行动价值匹配','分',0,100,75,'该安排是否符合自己的价值，不由花钱多少替代')\n  ]},\n  {id:'shocks',name:'第一周外部冲击',fields:[\n    f('marketShock','市场收益冲击','比例',-0.8,0.8,0,'例如 -0.10 表示当周额外下跌 10%，随后衰减'),\n    f('healthShock','健康损耗','分',0,50,0,'外部健康事件造成的状态减量'),f('incomeShock','收入变动','比例',-1,1,0,'与市场、健康冲击分开定义')\n  ]}\n];\nconst PARAM_FIELDS = [\n  f('fatigueRecovery','基础疲劳恢复率','比例/周',0.05,0.8,0.30,'睡到个人需求且质量为100分时的每周恢复比例；有效恢复率另由时长和质量计算'),\n  f('learningGain','学习增益系数','分/根号有效小时',0.1,4,1.2,'学习饱和增益；可试拟合'),\n  f('annualReturn','风险资产期望年收益','比例/年',-0.3,0.4,0.05,'纯情景假设，不代表市场预测'),\n  f('annualVol','风险资产年波动','比例/根号年',0.01,1,0.20,'年度标准差；按根号 52 换算周波动'),\n  f('debtAPR','债务年利率','比例/年',0,0.5,0.08,'周利息=期初本金×年利率/52'),\n  f('bufferWeeks','现金缓冲目标','周',1,52,8,'必要支出的目标覆盖周数，偏好而非建议'),\n  f('riskTolerance','额外损失容忍比例','比例',0,0.5,0.1,'对正净财富的主观容忍比例'),\n  f('beta','每周贴现因子','比例',0.8,1,0.99,'时间偏好；不是生理恢复系数'),\n  f('shockRetention','冲击留存率','比例/周',0,1,0.5,'仅衰减外部指定冲击'),\n  f('emotionRate','情绪不适权重','效用分/负荷分',0,1,0.12,'只评价即时情绪不适，不再扣实际金钱损失'),\n  f('healthRate','疲劳不适权重','效用分/疲劳分',0,1,0.10,'只评价高疲劳当期不适'),\n  f('desireRate','欲望失配权重','效用分/失配分',0,1,0.10,'品质缺口与价值偏离的体验成本'),\n  f('riskRate','风险不适权重','效用分/压力分',0,1,0.08,'风险敞口的主观不适，不重复扣市场亏损'),\n  f('sleepNeed','个人睡眠需求','小时/天',4,12,8,'个人假设，换算成7天需求；输入边界不是医学建议，默认8小时待核对'),\n  f('sleepDebtRepay','补眠偿还效率','债小时/超需睡眠小时',0,1,0.8,'超出个人需求的睡眠可逐步偿还睡眠债；上限1，不把补眠机械等同于逐小时偿还'),\n  f('sleepDebtImpact','睡眠债疲劳强度','分/周',0,30,6,'历史睡眠债对每周疲劳的平滑饱和增量上限；需真实连续记录校准')\n];\nconst UTILITY_LABELS = {safety:'安全',autonomy:'自主',quality:'品质',relation:'关系',growth:'成长',meaning:'意义'};\nconst SYSTEM_LABELS = {body:'身体',cognition:'认知',emotion:'情绪',social:'关系',finance:'金融',desire:'欲望'};\nconst TIME_KEYS = ['sleep','work','learn','exercise','relation','leisure','care'];\nconst DEFAULT_SCENARIO = {\n  version:VERSION,\n  state:Object.fromEntries(STATE_GROUPS.flatMap(g=>g.fields).map(f=>[f.key,f.value])),\n  plan:Object.fromEntries(PLAN_GROUPS.flatMap(g=>g.fields).map(f=>[f.key,f.value])),\n  parameters:Object.fromEntries(PARAM_FIELDS.map(f=>[f.key,f.value])),\n  weights:Object.fromEntries(Object.keys(UTILITY_LABELS).map(k=>[k,1]))\n};\nfunction clone(value){return JSON.parse(JSON.stringify(value));}\nfunction validateScenario(input){\n  const errors=[];\n  if(!input || input.version!==VERSION) return ['文件版本不匹配，需使用1.1数据或导入旧版数据'];\n  const check=(group,fields)=>{\n    const object=input[group];\n    if(!object || typeof object!=='object' || Array.isArray(object)){errors.push(`${group} 缺失`);return;}\n    const allowed=new Set(fields.map(f=>f.key));\n    for(const key of Object.keys(object)) if(!allowed.has(key))errors.push(`${group}.${key} 未定义`);\n    for(const f of fields) if(!Number.isFinite(object[f.key]) || object[f.key]\u003cf.min || object[f.key]>f.max) errors.push(`${f.label}需在 ${f.min}–${f.max} ${f.unit}之间`);\n  };\n  check('state',STATE_GROUPS.flatMap(g=>g.fields));check('plan',PLAN_GROUPS.flatMap(g=>g.fields));check('parameters',PARAM_FIELDS);\n  check('weights',Object.entries(UTILITY_LABELS).map(([key,label])=>({key,label,min:0,max:10})));\n  if(input.weights && Object.values(input.weights).every(v=>v===0))errors.push('至少一项效用权重大于零');\n  if(input.plan?.buy>0 && input.plan?.sell>0)errors.push('同一周不能同时设置买入和卖出');\n  return errors;\n}\nfunction upgradeScenario(input){\n  if(!input || ![VERSION,'1.1.0','1.0.0','0.3.0-research'].includes(input.version))throw new Error('不支持的数据版本');\n  const scenario={...clone(input),version:VERSION};\n  if(input.version!==VERSION){\n    scenario.state={...scenario.state,sleepDebt:scenario.state?.sleepDebt??0};\n    scenario.parameters={sleepNeed:8,sleepDebtRepay:.8,sleepDebtImpact:6,...scenario.parameters};\n  }\n  const errors=validateScenario(scenario);\n  if(errors.length)throw new Error(errors.join('；'));\n  return scenario;\n}\n\nreturn {VERSION,STATE_GROUPS,PLAN_GROUPS,PARAM_FIELDS,UTILITY_LABELS,SYSTEM_LABELS,TIME_KEYS,DEFAULT_SCENARIO,clone,validateScenario,upgradeScenario};\n})();\n__modules[\"sleep\"]=(()=>{\n// Weekly hypothesis model. Coefficients are not fitted clinical estimates.\nfunction sleepTransition(state,plan,parameters){\n  const need=7*parameters.sleepNeed,hours=plan.sleep,debtBefore=state.sleepDebt;\n  const deficit=Math.max(0,need-hours),surplus=Math.max(0,hours-need);\n  const qualityFactor=.5+.5*state.sleepQuality/100;\n  const availableDebt=debtBefore+deficit;\n  const repaymentBudget=parameters.sleepDebtRepay*qualityFactor*surplus;\n  const repaid=availableDebt>0?availableDebt*(-Math.expm1(-repaymentBudget/availableDebt)):0;\n  const debtAfter=Math.max(0,availableDebt-repaid),meanDebt=(debtBefore+debtAfter)/2;\n  // At personal need, adequacy=1. Above need it rises smoothly with diminishing returns.\n  const adequacy=-Math.expm1(-hours/need)/(-Math.expm1(-1));\n  const recovery=-Math.expm1(Math.log1p(-parameters.fatigueRecovery*qualityFactor)*adequacy);\n  const debtFatigue=parameters.sleepDebtImpact*(-Math.expm1(-meanDebt/need));\n  return {need,hours,deficit,surplus,debtBefore,availableDebt,repaymentBudget,repaid,debtAfter,m     const css=node=>node.ownerDocument.defaultView.getComputedStyle(node);
    if(['hidden','collapse'].includes(css(element).visibility))return false;
    for(let node=element;node;node=node.parentElement){

function assertLayout(document,label){
  const describe=node=>({id:node.id||null,tag:node.tagName,text:node.textContent.trim().replace(/\s+/g,' ').slice(0,80),
    rect:Object.fromEntries(['left','top','right','bottom','width','height'].map(key=>[key,node.getBoundingClientRect()[key]]))});
  const fail=(reason,nodes=[])=>{const error=new Error(`${label}: ${reason}`);error.diagnostics={label,elements:nodes.map(describe)};throw error;};
  if(document.documentElement.scrollWidth>document.documentElement.clientWidth+1)fail('页面横向溢出');
  for(const node of document.querySelectorAll('button,select,label,h1,h2,h3,.guide-compare-table td,.guide-compare-table th')){
    if(isRendered(node)&&node.scrollWidth>node.clientWidth+2)fail(`${node.textContent.slice(0,32)} 内容溢出`,[node]);
  }
  const buttons=[...document.querySelectorAll('button')].filter(isRendered);
  for(let i=0;i<buttons.length;i++)for(let j=i+1;j<buttons.length;j++){
    const a=buttons[i].getBoundingClientRect(),b=buttons[j].getBoundingClientRect();
    if(Math.min(a.right,b.right)-Math.max(a.left,b.left)>2&&Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>2){
      const name=node=>node.id?`#${node.id}`:node.textContent.trim().slice(0,24);
      fail(`按钮互相遮挡：${name(buttons[i])} 与 ${name(buttons[j])}`,[buttons[i],buttons[j]]);
    }
  }
}
